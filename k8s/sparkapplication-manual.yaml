apiVersion: "sparkoperator.k8s.io/v1beta2"
kind: SparkApplication
metadata:
  name: log-analysis-manual
  namespace: kubeflow
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: "docker.io/apache/spark:3.5.3-python3"
  imagePullPolicy: IfNotPresent
  mainApplicationFile: "local:///opt/spark/scripts/log_analysis.py"
  sparkVersion: "3.5.3"
  restartPolicy:
    type: Never
  volumes:
    - name: spark-scripts
      configMap:
        name: spark-log-analysis-script
  driver:
    cores: 1
    coreLimit: "1200m"
    memory: "512m"
    labels:
      version: 3.5.3
    serviceAccount: spark
    volumeMounts:
      - name: spark-scripts
        mountPath: /opt/spark/scripts
  executor:
    cores: 1
    instances: 2
    memory: "512m"
    labels:
      version: 3.5.3
    volumeMounts:
      - name: spark-scripts
        mountPath: /opt/spark/scripts
