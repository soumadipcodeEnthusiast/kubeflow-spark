apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pipeline-spark-role
  namespace: kubeflow
rules:
- apiGroups: ["sparkoperator.k8s.io"]
  resources: ["sparkapplications"]
  verbs: ["create", "get", "watch", "list", "delete"]
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-spark-rolebinding
  namespace: kubeflow
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pipeline-spark-role
subjects:
- kind: ServiceAccount
  name: default-editor
  namespace: kubeflow
